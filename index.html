<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notizen</title>
    <script>
      // Theme so früh wie möglich setzen, damit beim Laden nichts aufblitzt
      (function () {
        let theme = null;
        try {
          theme = localStorage.getItem("notizapp-theme");
        } catch (e) {}
        if (!theme) {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="notes-app" data-view="list">
      <!-- ============ Sidebar ============ -->
      <aside class="sidebar">
        <header class="sidebar__head">
          <h1 class="brand">Notizen</h1>
          <button
            class="icon-btn theme-toggle"
            type="button"
            title="Hell / Dunkel umschalten"
            aria-label="Hell / Dunkel umschalten"
          >
            <svg class="icon icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4" />
            </svg>
            <svg class="icon icon--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z" />
            </svg>
          </button>
        </header>

        <div class="search">
          <svg class="icon search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <circle cx="11" cy="11" r="6.5" />
            <path d="m20 20-4.2-4.2" />
          </svg>
          <input
            type="search"
            id="search-input"
            placeholder="Suchen"
            autocomplete="off"
          />
          <kbd class="search__kbd">⌘K</kbd>
        </div>

        <button class="create-new" type="button">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M12 5v14M5 12h14" />
          </svg>
          <span>Neue Notiz</span>
        </button>

        <div class="filters" role="tablist">
          <button class="filter is-active" data-filter="all" type="button">Alle</button>
          <button class="filter" data-filter="pinned" type="button">Angeheftet</button>
          <span class="filters__divider"></span>
          <button class="filter filter--dot" data-filter="red" type="button" aria-label="Rot"><i style="--dot: var(--tag-red)"></i></button>
          <button class="filter filter--dot" data-filter="amber" type="button" aria-label="Gelb"><i style="--dot: var(--tag-amber)"></i></button>
          <button class="filter filter--dot" data-filter="green" type="button" aria-label="Grün"><i style="--dot: var(--tag-green)"></i></button>
          <button class="filter filter--dot" data-filter="blue" type="button" aria-label="Blau"><i style="--dot: var(--tag-blue)"></i></button>
        </div>

        <div class="notes-list"></div>

        <footer class="sidebar__foot">
          <span class="notes-count"></span>
        </footer>
      </aside>

      <!-- ============ Editor ============ -->
      <main class="main-content">
        <div class="toolbar">
          <button class="icon-btn back-btn" type="button" aria-label="Zurück zur Liste">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 18 9 12l6-6" />
            </svg>
          </button>

          <span class="save-status" aria-live="polite"></span>

          <div class="toolbar__actions">
            <button class="icon-btn pin-note" type="button" title="Anheften" aria-label="Anheften">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 4h6l-1 6 3 3v1H7v-1l3-3-1-6Z" />
                <path d="M12 14v6" />
              </svg>
            </button>

            <div class="color-picker">
              <button class="icon-btn color-toggle" type="button" title="Farbe" aria-label="Farbe wählen">
                <span class="color-toggle__dot"></span>
              </button>
              <div class="color-menu" hidden>
                <button type="button" data-color="" aria-label="Keine Farbe"><i class="none"></i></button>
                <button type="button" data-color="red" aria-label="Rot"><i style="--dot: var(--tag-red)"></i></button>
                <button type="button" data-color="amber" aria-label="Gelb"><i style="--dot: var(--tag-amber)"></i></button>
                <button type="button" data-color="green" aria-label="Grün"><i style="--dot: var(--tag-green)"></i></button>
                <button type="button" data-color="blue" aria-label="Blau"><i style="--dot: var(--tag-blue)"></i></button>
              </div>
            </div>

            <button class="icon-btn preview-toggle" type="button" title="Vorschau (⌘E)" aria-label="Vorschau umschalten">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z" />
                <circle cx="12" cy="12" r="2.8" />
              </svg>
            </button>

            <button class="icon-btn export-note" type="button" title="Als Markdown herunterladen" aria-label="Exportieren">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 4v11m0 0-4-4m4 4 4-4M5 19h14" />
              </svg>
            </button>

            <button class="icon-btn save-note" type="button" title="Speichern (⌘S)" aria-label="Speichern">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="m5 12.5 4.5 4.5L19 7.5" />
              </svg>
            </button>

            <button class="icon-btn delete-note" type="button" title="Löschen" aria-label="Löschen">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4.5 7h15M10 11v6M14 11v6M6.5 7l.8 11.2A2 2 0 0 0 9.3 20h5.4a2 2 0 0 0 2-1.8L17.5 7M9.5 7V5a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v2" />
              </svg>
            </button>
          </div>
        </div>

        <div class="editor">
          <input
            type="text"
            id="title-input"
            placeholder="Titel"
            autocomplete="off"
          />
          <div class="editor__meta">
            <span class="meta-date"></span>
            <span class="meta-count"></span>
          </div>
          <textarea
            id="content-input"
            placeholder="Schreib einfach los …  (Markdown geht auch: # Titel, **fett**, - [ ] Aufgabe)"
          ></textarea>
          <article class="preview" hidden></article>
        </div>
      </main>
    </div>

    <div class="toast" role="status" hidden>
      <span class="toast__text"></span>
      <button class="toast__action" type="button">Rückgängig</button>
    </div>

    <script src="notesAPI.js"></script>
    <script src="index.js"></script>
  </body>
</html>
